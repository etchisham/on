name: northstar-dev

services:
  postgres:
    image: postgres:17.5-alpine3.22
    env_file:
      - .env.local
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-strapi}
      POSTGRES_USER: ${POSTGRES_USER:-strapi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-strapi} -d ${POSTGRES_DB:-strapi}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    env_file:
      - .env.local
    environment:
      NODE_ENV: development
      HOSTNAME: 0.0.0.0
      PORT: 3000
      STRAPI_INTERNAL_URL: http://cms:1337
    ports:
      - "3000:3000"
    volumes:
      - .:/workspace
      - web_node_modules:/workspace/node_modules
      - web_next:/workspace/apps/web/.next
    command: ["npm", "run", "dev:web"]
    depends_on:
      cms:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend

  cms:
    build:
      context: .
      dockerfile: apps/cms/Dockerfile
      target: dev
    env_file:
      - .env.local
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 1337
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-strapi}
      DATABASE_USERNAME: ${POSTGRES_USER:-strapi}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.local}
      PUBLIC_URL: http://localhost:1337
    ports:
      - "1337:1337"
    volumes:
      - .:/workspace
      - cms_node_modules:/workspace/node_modules
      - cms_cache:/workspace/apps/cms/.cache
      - cms_uploads:/workspace/apps/cms/public/uploads
    command: ["npm", "run", "develop"]
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend

volumes:
  postgres_data:
  web_node_modules:
  web_next:
  cms_node_modules:
  cms_cache:
  cms_uploads:

networks:
  backend:
    driver: bridge
