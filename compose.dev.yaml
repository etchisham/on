name: northstar-dev

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    env_file:
      - .env.local
    environment:
      NODE_ENV: development
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - .:/workspace
      - web_node_modules:/workspace/node_modules
      - web_next:/workspace/apps/web/.next
    command: ["npm", "run", "dev:web"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  studio:
    build:
      context: .
      dockerfile: apps/studio/Dockerfile
      target: dev
    env_file:
      - .env.local
    environment:
      NODE_ENV: development
      SANITY_STUDIO_PROJECT_ID: ${SANITY_STUDIO_PROJECT_ID:?Set SANITY_STUDIO_PROJECT_ID in .env.local}
      SANITY_STUDIO_DATASET: ${SANITY_STUDIO_DATASET:-production}
    ports:
      - "3333:3333"
    volumes:
      - .:/workspace
      - studio_node_modules:/workspace/node_modules
      - studio_sanity:/workspace/apps/studio/.sanity
    command: ["npm", "run", "dev:studio"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  web_node_modules:
  web_next:
  studio_node_modules:
  studio_sanity:
